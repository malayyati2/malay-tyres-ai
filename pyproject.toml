[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tyre-agents"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests==2.32.5",
    "streamlit==1.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
